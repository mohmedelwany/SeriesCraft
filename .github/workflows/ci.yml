name: CI

# ─────────────────────────────────────────────────────────────────────────────
# Trigger on PRs targeting any of our three protected branches.
# Each branch activates a different set of jobs (see `if:` conditions below).
#
#  next  → unit tests only   (fast feedback on feature branches)
#  qa    → unit + integration + E2E
#  main  → unit + integration + E2E  (merge gate)
# ─────────────────────────────────────────────────────────────────────────────
on:
  pull_request:
    branches:
      - next
      - qa
      - main

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — Unit tests (PHP + JS)
  # Runs on every PR regardless of target branch.
  # ───────────────────────────────────────────────────────────────────────────
  unit:
    name: "Unit Tests (PHP ${{ matrix.php-version }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.1", "8.2", "8.3"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── PHP ──────────────────────────────────────────────────────────────
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php-version }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint (phpcs)
        run: composer lint

      - name: PHP Unit tests
        run: composer test:unit

      # ── Node / JS ─────────────────────────────────────────────────────────
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: JS Unit tests (Jest)
        run: npm run test:unit:js

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — Integration tests (PHPUnit + Docker WP environment)
  # Runs only on PRs targeting qa or main.
  # Uses a single canonical PHP × WP cell (8.2 / latest) for speed.
  # Full cross-version matrix is available locally via: composer test:matrix
  # ───────────────────────────────────────────────────────────────────────────
  integration:
    name: "Integration Tests (PHP 8.2 / WP latest)"
    runs-on: ubuntu-latest
    if: github.base_ref == 'qa' || github.base_ref == 'main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-8.2-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.2-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Run integration tests (PHP 8.2 / WP latest)
        run: PHP_VERSIONS="8.2" WP_VERSIONS="latest" bash bin/test-integration-matrix.sh
        timeout-minutes: 20

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 — E2E tests (Playwright + wp-env)
  # Runs only on PRs targeting qa or main.
  # ───────────────────────────────────────────────────────────────────────────
  e2e:
    name: "E2E Tests (Playwright + wp-env)"
    runs-on: ubuntu-latest
    if: github.base_ref == 'qa' || github.base_ref == 'main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start wp-env
        run: npx wp-env start
        timeout-minutes: 5

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          WP_BASE_URL: "http://localhost:8888"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop wp-env
        if: always()
        run: npx wp-env stop
